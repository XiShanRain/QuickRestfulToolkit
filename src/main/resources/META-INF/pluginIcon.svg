<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="rr-badge" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0EA5A5"/>
            <stop offset="1" stop-color="#4338CA"/>
        </linearGradient>
        <linearGradient id="rr-sweep" x1="20" y1="8.5" x2="31.5" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <!-- 徽章底 -->
    <rect x="4" y="4" width="32" height="32" rx="8.5" fill="url(#rr-badge)"/>
    <!-- 扫描扇区 -->
