    <circle cx="20" cy="20" r="11.5" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95"/>
    <circle cx="20" cy="20" r="5.8" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"/>
